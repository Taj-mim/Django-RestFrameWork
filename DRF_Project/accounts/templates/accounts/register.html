
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins", Arial, sans-serif;
}


body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );

    padding:20px;

}



.register-container{

    width:100%;
    max-width:420px;

    background:white;

    padding:35px;

    border-radius:18px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.25);

    animation:fade .5s ease;

}



@keyframes fade{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}



h1{

    text-align:center;

    color:#222;

    font-size:30px;

    margin-bottom:8px;

}



.subtitle{

    text-align:center;

    color:#777;

    font-size:14px;

    margin-bottom:25px;

}



form p{

    margin-bottom:18px;

}



label{

    display:block;

    margin-bottom:6px;

    font-size:14px;

    font-weight:600;

    color:#333;

}



input{

    width:100%;

    padding:13px 14px;

    border:1px solid #ddd;

    border-radius:10px;

    font-size:15px;

    outline:none;

    transition:.3s;

}



input:focus{

    border-color:#667eea;

    box-shadow:
    0 0 8px rgba(102,126,234,.3);

}



.password-container{

    position:relative;

}



.password-container input{

    padding-right:60px;

}



.show-password{

    position:absolute;

    right:15px;

    top:50%;

    transform:translateY(-50%);

    color:#667eea;

    cursor:pointer;

    font-size:13px;

    font-weight:bold;

}



.strength-box{

    height:6px;

    background:#ddd;

    border-radius:5px;

    margin-top:8px;

}



.strength-bar{

    height:100%;

    width:0%;

    border-radius:5px;

    transition:.3s;

}



button{

    width:100%;

    padding:13px;

    margin-top:20px;

    border:none;

    border-radius:10px;

    background:#667eea;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}



button:hover{

    background:#5563d8;

}



.login-link{

    text-align:center;

    margin-top:22px;

    color:#666;

    font-size:14px;

}



.login-link a{

    color:#667eea;

    text-decoration:none;

    font-weight:bold;

}



.errorlist{

    color:red;

    list-style:none;

    font-size:13px;

}



</style>


</head>


<body>


<div class="register-container">


<h1>Create Account</h1>


<p class="subtitle">
Join us and start your journey
</p>



<form method="POST">


{% csrf_token %}


{{ form.as_p }}



<div class="password-container">

<span class="show-password" onclick="togglePassword()">
Show
</span>

</div>



<div class="strength-box">

<div class="strength-bar" id="strengthBar">

</div>

</div>



<button type="submit">

Create Account

</button>


</form>



<div class="login-link">

Already have an account?

<a href="{% url 'login' %}">
Login
</a>


</div>



</div>




<script>


// Show / Hide Password

function togglePassword(){

    let password =
    document.getElementById("id_password");


    let text =
    document.querySelector(".show-password");


    if(password.type === "password"){

        password.type="text";

        text.innerHTML="Hide";

    }

    else{

        password.type="password";

        text.innerHTML="Show";

    }

}




// Password Strength

let password =
document.getElementById("id_password");


let bar =
document.getElementById("strengthBar");



password.addEventListener("input",()=>{


    let score=0;

    let value=password.value;



    if(value.length >= 8)
        score+=25;


    if(/[A-Z]/.test(value))
        score+=25;


    if(/[0-9]/.test(value))
        score+=25;


    if(/[^A-Za-z0-9]/.test(value))
        score+=25;



    bar.style.width=score+"%";


});



</script>


</body>

</html>
